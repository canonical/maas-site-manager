name: E2E
on:
  push:
    branches:
      - main
      - cypress-debug-*
jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-24.04
    env:
      VITE_USE_MOCK_DATA: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: yarn install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: yarn playwright-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  cypress:
    name: Cypress
    runs-on: ubuntu-24.04
    env:
      VITE_USE_MOCK_DATA: true
      MSM_UI_URL: http://localhost:8405
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        groups: ["no-users", "with-users"]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install dependencies
        run: yarn install
      - name: Download map assets
        # The Natural Earth pmtiles basemap is gitignored and fetched by
        # scripts/download-map-assets.sh, which intentionally skips the download
        # when CI=true. The map e2e tests need it: without the basemap the
        # MapLibre style never finishes loading, the markers layer is never
        # added, and queryRenderedFeatures returns no site markers. Run the
        # script with CI unset so the basemap is downloaded for these tests.
        run: CI= yarn run download-map-assets
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          config: baseUrl=${{env.MSM_UI_URL}},pageLoadTimeout=100000
          install: false
          # The sites map renders via MapLibre GL (WebGL) and CI runners have
          # no GPU, so the browser must fall back to software WebGL
          # (SwiftShader, configured in cypress.config.ts). Those flags are only
          # honoured by Chromium-family browsers launched from the command line
          # (Electron ignores them), so run in Chrome rather than the default
          # Electron browser. Run headed under Xvfb (started automatically by
          # Cypress on Linux): headless Chrome does not reliably composite
          # software-rendered WebGL, so `queryRenderedFeatures` returns no map
          # features and the site markers never appear.
          browser: chrome
          headed: true
          start: yarn dev
          spec: cypress/e2e/${{ matrix.groups }}/**/*.spec.ts
          wait-on: ${{env.MSM_UI_URL}}/login
          working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
