name: Ask for permission to send Mattermost message
on:
  pull_request:
    types: [opened]
jobs:
  add-mm-permission-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Ask user for permission to send Mattermost message
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADMIN_PAT }}
          script: |
            await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `- [ ] Check here if you would like a Mattermost message when CI completes and when this PR is merged.`
              });
              return;
            }
