name: CI check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}

    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: dorny/paths-filter@61f87a10cd2c304679af17bb73ef192addf33c1c
        id: filter
        with:
          filters: |
            lint:
              - 'frontend/**/*.ts'
              - 'frontend/**/*.tsx'
              - 'frontend/**/*.js'
              - 'frontend/**/*.jsx'
              - 'frontend/**/*.scss'
              - 'frontend/package.json'
              - 'frontend/Makefile'
              - 'backend/**/*.py'
              - 'backend/pyproject.toml'
              - 'backend/tox.ini'
              - 'backend/Makefile'
              - 'Makefile'
            backend:
              - 'backend/**/*.py'
              - 'backend/pyproject.toml'
              - 'backend/tox.ini'
              - 'backend/Makefile'
            frontend:
              - 'frontend/**/*.ts'
              - 'frontend/**/*.tsx'
              - 'frontend/**/*.js'
              - 'frontend/**/*.jsx'
              - 'frontend/**/*.scss'
              - 'frontend/package.json'
              - 'frontend/Makefile'
            docs:
              - 'rtd-docs/**'

  lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.lint == 'true' }}
    container:
      image: ghcr.io/${{ github.repository }}-build-env:${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/ci-setup

      - name: Run lint
        run: |
          su ubuntu -c "make ci-lint"

  test-backend:
    needs: changes
    runs-on: ubuntu-24.04
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.backend == 'true' }}

    container:
      image: ghcr.io/${{ github.repository }}-build-env:${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/ci-setup

      - name: Test
        run: |
          CACHE_DIR=/home/ubuntu/.cache/pip
          su ubuntu -c "PIP_CACHE_DIR=$CACHE_DIR make -C backend ci-test"

  test-frontend:
    needs: changes
    runs-on: ubuntu-24.04
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.frontend == 'true' }}

    container:
      image: ghcr.io/${{ github.repository }}-build-env:${{ github.event_name == 'merge_group' && 'main' || github.base_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/ci-setup
      - name: Set correct ownership of frontend directory
        run: |
          chown -R ubuntu:ubuntu frontend/node_modules
      - name: Test
        run: |
          su ubuntu -c "make -C frontend ci-test"
  test-docs:
    needs: changes
    runs-on: ubuntu-24.04
    if: >-
      ${{ !github.event.pull_request.draft && needs.changes.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0
      - name: Create venv
        working-directory: "rtd-docs"
        run: make install
      - name: Lint markdown
        working-directory: "rtd-docs"
        run: make lint-md
      - name: Test build
        working-directory: "rtd-docs"
        run: make html

  ci-check:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test-backend, test-frontend, test-docs]
    steps:
      - name: Determine overall CI status
        id: status
        run: |
          # If any dependency failed or was cancelled, mark as failure
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "state=failure" >> $GITHUB_OUTPUT
          else
            echo "state=success" >> $GITHUB_OUTPUT
          fi

      - name: Parse Preferences & Resolve Identity
        id: MattermostStep
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          DEFAULT_CHANNEL: ${{ vars.MM_CHANNEL }}
          CI_STATE: ${{ steps.status.outputs.state }}
        with:
          github-token: ${{ secrets.ADMIN_PAT || github.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const state = process.env.CI_STATE;
            const emoji = state === 'success' ? '✅' : '❌';
            let statusMessage = `${emoji} CI Checks for PR #${prNumber} ("${context.payload.pull_request.title}") finished: **${state.toUpperCase()}**.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const promptText = "Check where you would like a Mattermost message to be sent";
            const MattermostComment = comments.find(c => c.body.includes(promptText));

            if (!MattermostComment) {
              console.log("No permission comment found. Skipping.");
              core.setOutput('send_message', 'false');
              return;
            }

            const wantsDM = /-\s*\[[xX]\]\s*Direct message/i.test(MattermostComment.body);
            const channelRegex = /-\s*\[[xX]\]\s*~([^\r\n]+)/i;
            const channelMatch = MattermostComment.body.match(channelRegex);
            const wantsChannel = channelMatch ? channelMatch[1].trim() : null;

            if (!wantsDM && !wantsChannel) {
              console.log("No options selected. Skipping.");
              core.setOutput('send_message', 'false');
              return;
            }

            let targetChannel = wantsChannel || process.env.DEFAULT_CHANNEL || "maas";

            if (wantsDM) {
              try {
                const { data: commitData } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: context.payload.pull_request.head.sha
                });
                const email = commitData.commit.author.email;

                const MattermostURL = new URL(process.env.MATTERMOST_WEBHOOK_URL).origin;
                const MattermostResponse = await fetch(`${MattermostURL}/api/v4/users/email/${email}`, {
                  headers: { 'Authorization': `Bearer ${process.env.MATTERMOST_BOT_TOKEN}` }
                });

                if (MattermostResponse.ok) {
                  const MattermostUser = await MattermostResponse.json();
                  targetChannel = `@${MattermostUser.username}`;
                } else {
                  statusMessage += `\n*(Note: Could not find Mattermost account for ${email})*`;
                }
              } catch (e) {
                console.error("Mattermost lookup failed:", e);
                statusMessage += `\n*(Note: Mattermost user lookup failed)*`;
              }
            }

            core.setOutput('send_message', 'true');
            core.setOutput('target_channel', targetChannel);
            core.setOutput('payload_text', statusMessage);

      - name: Send Mattermost Notification
        if: github.event_name == 'pull_request' && steps.MattermostStep.outputs.send_message == 'true'
        uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        with:
          payload: |-
            {
              "text": ${{ toJSON(steps.MattermostStep.outputs.payload_text) }},
              "channel": "${{ steps.MattermostStep.outputs.target_channel }}",
              "username": "maasbot",
              "icon_url": "https://launchpadlibrarian.net/91453111/Phoenix_landing-64x64.jpg"
            }

      - name: Fail pipeline if dependencies failed
        if: steps.status.outputs.state == 'failure'
        run: exit 1
